name: windows-build

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version used for the build
        required: false
        default: "3.12"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version || '3.12' }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller cbp.spec --noconfirm --distpath dist --workpath build

      - name: Stage game data and logos
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force data dist\CBP\data
          Copy-Item -Force logo.png dist\CBP\logo.png
          Copy-Item -Force logo.ico dist\CBP\logo.ico

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\CBP\CBP.exe" -PassThru
          Start-Sleep -Seconds 45
          if ($process.HasExited) {
            Write-Host "::error::CBP exited early with exit code $($process.ExitCode)"
            exit 1
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Smoke test passed: CBP stayed alive for 45 seconds"

      - name: Zip build (max deflate)
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=9 -mfb=258 -mpass=15 CBP-windows.zip ".\dist\CBP\*"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBP-windows
          path: CBP-windows.zip
          retention-days: 14
          compression-level: 0
